services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bankpilot
      POSTGRES_USER: bankpilot
      POSTGRES_PASSWORD: bankpilot
    ports:
      - "54329:5432"
    volumes:
      - bankpilot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankpilot -d bankpilot"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  bankpilot_postgres:

