services:
  postgres:
    image: postgres:17-alpine
    container_name: bankpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=40
    volumes:
      - bankpilot_postgres:/var/lib/postgresql/data
      - ../db/migrations/001_init.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ../db/migrations/002_identity_and_platform.sql:/docker-entrypoint-initdb.d/20-platform.sql:ro
      - ../db/migrations/003_agent_runtime_and_channels.sql:/docker-entrypoint-initdb.d/30-agent-runtime.sql:ro
      - ../db/migrations/004_langgraph_checkpoint_schema.sql:/docker-entrypoint-initdb.d/40-langgraph-checkpoints.sql:ro
      - ../db/migrations/005_qq_channel.sql:/docker-entrypoint-initdb.d/50-qq-channel.sql:ro
      - ../db/migrations/007_nanobot_preview.sql:/docker-entrypoint-initdb.d/70-nanobot-preview.sql:ro
    networks:
      - internal
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: bankpilot:latest
    container_name: bankpilot-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      BANKPILOT_PUBLIC_URL: ${BANKPILOT_PUBLIC_URL}
      NANOBOT_SERVICE_URL: http://nanobot:8080
      NANOBOT_SERVICE_TOKEN: ${NANOBOT_SERVICE_TOKEN:-}
      WECOM_ADAPTER_TOKEN: ${WECOM_ADAPTER_TOKEN:-}
      QQ_ADAPTER_TOKEN: ${QQ_ADAPTER_TOKEN:-}
      QQ_BOT_ENTRY_URL: ${QQ_BOT_ENTRY_URL:-}
      QQ_BOT_NAME: ${QQ_BOT_NAME:-BankPilot}
      WECOM_BOT_ENTRY_URL: ${WECOM_BOT_ENTRY_URL:-}
      WECOM_BOT_NAME: ${WECOM_BOT_NAME:-BankPilot}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      internal:
      edge:
        aliases:
          - bankpilot-app
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nanobot:
    profiles: ["nanobot"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.nanobot
    image: bankpilot-nanobot:latest
    container_name: bankpilot-nanobot
    restart: unless-stopped
    environment:
      AI_BASE_URL: ${AI_BASE_URL}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL}
      BANKPILOT_MCP_URL: ${BANKPILOT_PUBLIC_URL}/api/mcp
      BANKPILOT_CALLBACK_URL: http://app:3000/api/internal/nanobot/result
      NANOBOT_SERVICE_TOKEN: ${NANOBOT_SERVICE_TOKEN}
      NANOBOT_DATA_DIR: /data
    volumes:
      - bankpilot_nanobot:/data
    networks:
      - internal
      - nanobot_egress
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /home/bankagent:size=16m,uid=10001,gid=10001,mode=700
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 96
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  wecom:
    profiles: ["wecom"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.wecom
    image: bankpilot-wecom:latest
    container_name: bankpilot-wecom
    restart: unless-stopped
    environment:
      BANKPILOT_INTERNAL_URL: http://app:3000
      WECOM_ADAPTER_TOKEN: ${WECOM_ADAPTER_TOKEN}
      WECOM_BOT_ID: ${WECOM_BOT_ID}
      WECOM_BOT_SECRET: ${WECOM_BOT_SECRET}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal
      - edge
    mem_limit: 256m
    cpus: 0.5

  qq:
    profiles: ["qq"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.qq
    image: bankpilot-qq:latest
    container_name: bankpilot-qq
    restart: unless-stopped
    environment:
      BANKPILOT_INTERNAL_URL: http://app:3000
      QQ_ADAPTER_TOKEN: ${QQ_ADAPTER_TOKEN}
      QQBOT_APP_ID: ${QQBOT_APP_ID}
      QQBOT_APP_SECRET: ${QQBOT_APP_SECRET}
    depends_on:
      app:
        condition: service_healthy
    networks:
      - internal
      - edge
    mem_limit: 256m
    cpus: 0.5

volumes:
  bankpilot_nanobot:
    name: bankpilot_nanobot
  bankpilot_postgres:
    name: bankpilot_postgres

networks:
  nanobot_egress:
  internal:
    name: bankpilot_internal
    internal: true
  edge:
    external: true
    name: premsir-chat_backend
