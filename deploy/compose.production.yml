services:
  postgres:
    image: postgres:17-alpine
    container_name: bankpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=40
    volumes:
      - bankpilot_postgres:/var/lib/postgresql/data
      - ../db/migrations/001_init.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ../db/migrations/002_identity_and_platform.sql:/docker-entrypoint-initdb.d/20-platform.sql:ro
    networks:
      - internal
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: bankpilot:latest
    container_name: bankpilot-app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      internal:
      edge:
        aliases:
          - bankpilot-app
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  bankpilot_postgres:
    name: bankpilot_postgres

networks:
  internal:
    name: bankpilot_internal
    internal: true
  edge:
    external: true
    name: premsir-chat_backend
